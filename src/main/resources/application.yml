server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: shepard
    # To set enviorments profile (dev, prod and test)
  profiles:
    active:   ${SPRING_PROFILES_ACTIVE:prod}
frontend:
  reset-password:
    url: urlfront